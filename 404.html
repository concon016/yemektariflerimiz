<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sayfa Bulunamadı — yemektariflerimiz</title>
<meta name="description" content="Aradığınız sayfa bulunamadı.">
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<script>
  (function () {
    var saved = localStorage.getItem("theme");
    var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.setAttribute("data-theme", saved || (prefersDark ? "dark" : "light"));
  })();
</script>
<link rel="stylesheet" href="/style.css">
<style>
  .notfound { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 80px 24px; gap: 16px; }
  .notfound .emoji { font-size: 56px; }
  .notfound h1 { font-size: 32px; }
</style>
</head>
<body>
<main>
  <div class="notfound">
    <span class="emoji">📖</span>
    <h1>Bu sayfa kitabımızda yok</h1>
    <p style="max-width:40ch;">Aradığınız tarif ya da sayfa bulunamadı. Belki de henüz yazılmamış bir bölümdür.</p>
    <a href="/" class="btn btn-primary">Ana Sayfaya Dön</a>
  </div>
</main>
<script src="/script.js"></script>
</body>
</html>
